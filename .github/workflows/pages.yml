name: Deploy CHRONOS to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Validate and prepare immersive CHRONOS viewport
        run: |
          test -s index.html
          test -s chronos-responsive.css
          echo "CHRONOS entry point and responsive shell found"
          test -f .nojekyll || touch .nojekyll
          python3 - <<'PY'
          from pathlib import Path
          page = Path('index.html')
          css = Path('chronos-responsive.css').read_text(encoding='utf-8')
          html = page.read_text(encoding='utf-8')
          marker = '<!-- CHRONOS_IMMERSIVE_CSS -->'
          if marker not in html:
              injection = marker + '<style id="chronos-immersive-css">\n' + css + '\n</style>'
              html = html.replace('</head>', injection + '</head>', 1)
              page.write_text(html, encoding='utf-8')
          print('Immersive responsive CSS injected for deployment; application logic remains unchanged.')
          PY

      - name: Upload complete site
        uses: actions/upload-pages-artifact@v4
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
