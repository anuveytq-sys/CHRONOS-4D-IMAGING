name: Deploy CHRONOS to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Validate and prepare CHRONOS viewport
        run: |
          set -eu
          test -s index.html
          test -s chronos-responsive.css
          test -s chronos-viewport-refinement.css
          test -s chronos-phase2.css
          test -s chronos-phase2.js
          test -s chronos-phase3.css
          test -s chronos-phase3.js
          test -s chronos-phase4.css
          test -s chronos-phase4.js
          test -s chronos-settings-tools.js
          test -s chronos-multi4d.css
          test -s chronos-multi4d.js
          node --check chronos-phase4.js
          node --check chronos-settings-tools.js
          node --check chronos-multi4d.js
          echo "CHRONOS entry point and Phase 2–4 engines found"
          test -f .nojekyll || touch .nojekyll
          python3 - <<'PY'
          from pathlib import Path
          page = Path('index.html')
          css = Path('chronos-responsive.css').read_text(encoding='utf-8')
          refinement = Path('chronos-viewport-refinement.css').read_text(encoding='utf-8')
          phase2_css = Path('chronos-phase2.css').read_text(encoding='utf-8')
          phase3_css = Path('chronos-phase3.css').read_text(encoding='utf-8')
          phase4_css = Path('chronos-phase4.css').read_text(encoding='utf-8')
          multi4d_css = Path('chronos-multi4d.css').read_text(encoding='utf-8')
          html = page.read_text(encoding='utf-8')
          if 'chronos-phase4.css' not in html or 'chronos-phase4.js' not in html:
              raise SystemExit('Phase 4 assets are not linked from index.html')
          marker = '<!-- CHRONOS_IMMERSIVE_CSS -->'
          if marker not in html:
              injection = marker + '<style id="chronos-immersive-css">\n' + css + '\n' + refinement + '\n' + phase2_css + '\n' + phase3_css + '\n' + phase4_css + '\n</style>'
              html = html.replace('</head>', injection + '</head>', 1)
          script_marker = '<!-- CHRONOS_PHASE2_ENGINE -->'
          if script_marker not in html and 'src="./chronos-phase2.js"' not in html and 'src="chronos-phase2.js"' not in html:
              script = script_marker + '<script src="chronos-phase2.js"></script>'
              html = html.replace('</body>', script + '</body>', 1)
          phase3_marker = '<!-- CHRONOS_PHASE3_ENGINE -->'
          if phase3_marker not in html and 'src="./chronos-phase3.js' not in html and 'src="chronos-phase3.js' not in html:
              script = phase3_marker + '<script src="chronos-phase3.js"></script>'
              html = html.replace('</body>', script + '</body>', 1)
          phase4_marker = '<!-- CHRONOS_PHASE4_ENGINE -->'
          if phase4_marker not in html and 'src="./chronos-phase4.js' not in html and 'src="chronos-phase4.js' not in html:
              script = phase4_marker + '<script src="chronos-phase4.js"></script>'
              html = html.replace('</body>', script + '</body>', 1)
          multi4d_marker = '<!-- CHRONOS_MULTI4D_ENGINE -->'
          if multi4d_marker not in html and 'chronos-multi4d.js' not in html:
              script = multi4d_marker + '<script src="chronos-multi4d.js?v=20261021-layoutfix2"></script>'
              html = html.replace('</body>', script + '</body>', 1)
          settings_marker = '<!-- CHRONOS_SETTINGS_TOOLS -->'
          if settings_marker not in html and 'src="./chronos-settings-tools.js"' not in html and 'src="chronos-settings-tools.js"' not in html:
              script = settings_marker + '<script src="chronos-settings-tools.js"></script>'
              html = html.replace('</body>', script + '</body>', 1)
          page.write_text(html, encoding='utf-8')
          print('CHRONOS responsive CSS, Phase 2–4 assets, Multi 4D Timeline, and Settings tools prepared for deployment.')
          PY

      - name: Upload complete site
        uses: actions/upload-pages-artifact@v4
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
